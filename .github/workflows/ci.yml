name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Tests run against mongodb-memory-server; keep its mongod binary in a cached folder instead of node_modules.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v4
      # Production target (render.yaml NODE_VERSION, Dockerfile node:24).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Cache MongoDB test binary
        uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies (lockfile)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck server and web
        run: npm run typecheck
      - name: Test server and web
        run: npm test
      - name: Build PWA
        run: npm run build
      # Fails on high or critical advisories in production dependencies (see docs/DECISIONS.md).
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image (not pushed)
        run: docker build -t shadeloop:ci .
