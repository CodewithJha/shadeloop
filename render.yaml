services:
  - type: web
    name: shadeloop
    runtime: docker # the Dockerfile builds the PWA and starts the server with Sentry preloaded
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: MONGODB_URI
        sync: false # MongoDB Atlas connection string
      - key: MONGODB_DB
        value: shadeloop
      - key: AI_PROVIDER
        value: openai # Gemma 4 through Google AI Studio's OpenAI-compatible endpoint; "none" uses templates only
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: OPENAI_MODEL
        value: gemma-4-26b-a4b-it
      - key: OPENAI_API_KEY
        sync: false # Google AI Studio key
      - key: DISCOVERY_MODE
        value: live
      - key: SERPAPI_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: TIGER_DATABASE_URL
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false
