services:
  - type: web
    name: shadeloop
    runtime: node
    plan: free
    region: singapore
    # Dev dependencies (vite) are needed to build the PWA even though NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: MONGOMS_DISABLE_POSTINSTALL # skip the test-only mongod download (~100 MB) during npm ci
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: MONGODB_URI
        sync: false # MongoDB Atlas connection string
      - key: MONGODB_DB
        value: shadeloop
      - key: AI_PROVIDER
        value: openai # Gemma 4 through Google AI Studio's OpenAI-compatible endpoint; "none" uses templates only
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: OPENAI_MODEL
        value: gemma-4-26b-a4b-it
      - key: OPENAI_API_KEY
        sync: false # Google AI Studio key
      - key: DISCOVERY_MODE
        value: live
      - key: SERPAPI_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: TIGER_DATABASE_URL
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false
